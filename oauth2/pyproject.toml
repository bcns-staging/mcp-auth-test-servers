[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oauth2-server"
version = "0.1.0"
description = "Minimal MCP server + OAuth 2.0 authorization server for testing an MCP client's OAuth flow"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.29.0,<2.0.0",
    "starlette>=0.37.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
